<body class="min-h-screen flex items-center justify-center p-md md:p-lg mesh-gradient">
<!-- Background Animation Layer (Subtle Mesh) -->
<div class="fixed inset-0 pointer-events-none opacity-40">

</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[440px] flex flex-col gap-lg">
<!-- Brand Header (Center Aligned for Focus) -->
<div class="flex flex-col items-center gap-sm">
<div class="w-12 h-12 bg-primary-container rounded-xl flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-primary-container text-[28px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">AI Team Hub</h1>
</div>
<!-- Login Card -->
<div class="glass-panel rounded-xl p-lg md:p-xl shadow-2xl flex flex-col gap-lg">
<div class="flex flex-col gap-xs">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access your workspace.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="return false;">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-low border border-outline-variant rounded-lg text-on-surface placeholder:text-outline font-body-md input-focus-ring transition-all" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-low border border-outline-variant rounded-lg text-on-surface placeholder:text-outline font-body-md input-focus-ring transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm">
<input class="w-4 h-4 rounded border-outline-variant bg-surface-container-low text-primary-container focus:ring-primary-container focus:ring-offset-background" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant select-none" for="remember">Remember me for 30 days</label>
</div>
<!-- Actions -->
<div class="flex flex-col gap-sm pt-sm">
<button class="w-full h-12 bg-primary-container text-on-primary-container font-headline-md text-[16px] rounded-lg shadow-md flex items-center justify-center gap-sm btn-hover-effect hover:bg-primary-container/90" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="relative py-md">
<div class="absolute inset-0 flex items-center">
<span class="w-full border-t border-outline-variant"></span>
</div>
<div class="relative flex justify-center text-label-sm uppercase">
<span class="bg-surface-container px-sm text-outline font-label-sm">Or continue with</span>
</div>
</div>
<button class="w-full h-12 bg-surface-container-high border border-outline-variant text-on-surface font-body-md font-semibold rounded-lg flex items-center justify-center gap-sm btn-hover-effect hover:bg-surface-bright transition-colors" type="button">

                        Google

</div>
<script>
        // Simple micro-interaction for button press
        document.querySelector('form').addEventListener('submit', function(e) {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span> Authenticating...`;
            btn.classList.add('opacity-80');
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.classList.remove('opacity-80');
                btn.disabled = false;
            }, 1500);
        });

        // Interactive Focus Effect
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#b4c5ff';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#8d90a0';
            });
        });
    </script>
